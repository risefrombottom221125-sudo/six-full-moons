<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enam Purnama</title>
    <!-- Tailwind CSS untuk tata letak -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk menerjemahkan JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Versi Compat untuk Single File HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <!-- Font Lora untuk estetika puisi klasik -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #2c2925;
            font-family: 'Lora', serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .perspective-wrapper {
            perspective: 2500px;
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .notebook-page {
            background-color: #FDF6E3;
            min-height: 80vh;
            border-radius: 4px 16px 16px 4px;
            box-shadow: 
                inset 12px 0 20px -5px rgba(0,0,0,0.1),
                15px 20px 30px rgba(0,0,0,0.3);
            border-left: 5px solid #d4c5a9;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: left center;
        }

        .lined-paper {
            background-image: repeating-linear-gradient(
                transparent, 
                transparent 31px, 
                #eadaaf 31px, 
                #eadaaf 32px
            );
            line-height: 32px;
            padding: 32px 40px;
            min-height: 100%;
        }

        .flip-forward {
            animation: flipForwardAnim 1.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        }
        .flip-backward {
            animation: flipBackwardAnim 1.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        }

        @keyframes flipForwardAnim {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
            40% { transform: rotateY(-30deg) skewY(-3deg) scale(1.02); filter: brightness(0.9); box-shadow: 25px 30px 40px rgba(0,0,0,0.2); }
            100% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
        }

        @keyframes flipBackwardAnim {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
            40% { transform: rotateY(30deg) skewY(3deg) scale(1.02); filter: brightness(0.9); box-shadow: -15px 30px 40px rgba(0,0,0,0.2); }
            100% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
        }

        .fade-out { opacity: 0; transition: opacity 0.4s ease; }
        .fade-in { opacity: 1; transition: opacity 0.8s ease; }

        textarea, input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            resize: none;
            font-family: inherit;
        }
        
        textarea {
            line-height: 32px;
            margin-top: 1px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyA01WZXTncUbf1SPhkg40VvME_99PbGhLA",
            authDomain: "enam--purnama.firebaseapp.com",
            projectId: "enam--purnama",
            storageBucket: "enam--purnama.firebasestorage.app",
            messagingSenderId: "448620493821",
            appId: "1:448620493821:web:98ee9f04ec0d26814d7794"
        };
        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // -----------------------------

        const { useState, useEffect, Fragment } = React;

        const BookIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const PenIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.58 7.58"></path></svg>;
        const ArrowLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
        const ArrowRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const SendIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
        const PlusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [animClass, setAnimClass] = useState('');
            const [contentState, setContentState] = useState('fade-in');
            
            // Data Firebase State
            const [introContent, setIntroContent] = useState('Memuat pendahuluan...');
            const [poems, setPoems] = useState([]);
            
            // Mode Draft untuk Penulis
            const [draftIntro, setDraftIntro] = useState('');
            const [draftTitle, setDraftTitle] = useState('');
            const [draftContent, setDraftContent] = useState('');

            const [activePoemId, setActivePoemId] = useState(null);
            const [newNote, setNewNote] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [editingNoteIdx, setEditingNoteIdx] = useState(null);
            const [editNoteText, setEditNoteText] = useState('');

            const fallbackPoem = { id: 0, title: '', author: '', date: '', content: '', notes: [] };
            const activePoem = poems.find(p => p.id === activePoemId) || poems[0] || fallbackPoem;

            // Efek untuk memuat data dari Firestore secara real-time
            useEffect(() => {
                // 1. Memuat Pendahuluan
                const introRef = db.collection('settings').doc('intro');
                const unsubIntro = introRef.onSnapshot(doc => {
                    if (doc.exists) {
                        setIntroContent(doc.data().content);
                    } else {
                        // Jika baru pertama kali dibuat, set teks bawaan
                        const defaultIntro = 'Selamat datang di Enam Purnama.\n\nBuku catatan ini adalah kumpulan sajak yang ditulis dengan segenap rasa, didedikasikan khusus untuk satu orang pembaca yang selalu menjadi inspirasi di setiap barisnya.\n\nSilakan buka lembaran berikutnya untuk membaca.';
                        introRef.set({ content: defaultIntro });
                        setIntroContent(defaultIntro);
                    }
                });

                // 2. Memuat Daftar Puisi
                const unsubPoems = db.collection('poems').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
                    const loadedPoems = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setPoems(loadedPoems);
                });

                return () => {
                    unsubIntro();
                    unsubPoems();
                };
            }, []);

            const navigateTo = (view, direction = 'forward') => {
                setContentState('fade-out');
                setTimeout(() => {
                    setAnimClass(direction === 'forward' ? 'flip-forward' : 'flip-backward');
                    setCurrentView(view);
                    setTimeout(() => {
                        setContentState('fade-in');
                        setTimeout(() => setAnimClass(''), 800);
                    }, 900);
                }, 400);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === '070524') {
                    setLoginError('');
                    setPassword('');
                    navigateTo('writer-toc', 'forward');
                } else {
                    setLoginError('Sandi keliru. Akses hanya untuk penulis.');
                }
            };

            // ---- FUNGSI DATABASE FIREBASE ----

            const saveIntroAndExit = async () => {
                await db.collection('settings').doc('intro').update({ content: draftIntro });
                navigateTo('writer-toc', 'backward');
            };

            const savePoemAndExit = async () => {
                if (activePoemId) {
                    await db.collection('poems').doc(activePoemId).update({
                        title: draftTitle,
                        content: draftContent
                    });
                }
                navigateTo('writer-toc', 'backward');
            };

            const addNewPoem = async () => {
                const today = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                const docRef = await db.collection('poems').add({
                    title: 'Puisi Baru',
                    author: 'Marchel',
                    date: today,
                    content: '',
                    notes: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                setActivePoemId(docRef.id);
                setDraftTitle('Puisi Baru');
                setDraftContent('');
                navigateTo('writer', 'forward');
            };

            const handleDeletePoem = async (e, id) => {
                e.stopPropagation();
                if (window.confirm('Apakah Anda yakin ingin menghapus karya ini secara permanen?')) {
                    await db.collection('poems').doc(id).delete();
                }
            };

            const handleAddNote = async (e) => {
                e.preventDefault();
                if (newNote.trim() && activePoem.id !== 0) {
                    await db.collection('poems').doc(activePoem.id).update({
                        notes: firebase.firestore.FieldValue.arrayUnion(newNote)
                    });
                    setNewNote('');
                }
            };

            const handleSaveEditNote = async (idx) => {
                if (editNoteText.trim() && activePoem.id !== 0) {
                    const updatedNotes = [...activePoem.notes];
                    updatedNotes[idx] = editNoteText;
                    
                    await db.collection('poems').doc(activePoem.id).update({
                        notes: updatedNotes
                    });
                    setEditingNoteIdx(null);
                    setEditNoteText('');
                }
            };

            // ---- KOMPONEN UI ----

            const renderHome = () => (
                <div className="flex flex-col items-center justify-center h-full text-center mt-20">
                    <h1 className="text-4xl md:text-5xl font-semibold text-gray-800 mb-2">Enam Purnama</h1>
                    <p className="text-lg text-gray-600 italic mb-16 border-b-2 border-gray-400/30 pb-4 inline-block px-8">
                        di dedikasikan hanya untuk satu pembaca
                    </p>
                    
                    <div className="flex flex-col gap-6 w-full max-w-xs mx-auto">
                        <button onClick={() => navigateTo('reader-intro', 'forward')} className="flex items-center justify-center gap-3 bg-gray-800 text-[#FDF6E3] py-3 px-6 rounded hover:bg-gray-700 transition shadow-lg">
                            <BookIcon /> Mulai Membaca
                        </button>
                        <button onClick={() => navigateTo('login', 'forward')} className="flex items-center justify-center gap-3 border border-gray-800 text-gray-800 py-3 px-6 rounded hover:bg-gray-800/10 transition">
                            <PenIcon /> Portal Penulis
                        </button>
                    </div>
                </div>
            );

            const renderLogin = () => (
                <div className="flex flex-col items-center justify-center h-full mt-20">
                    <button onClick={() => navigateTo('home', 'backward')} className="self-start flex gap-2 items-center text-gray-500 hover:text-gray-800 mb-12">
                        <ArrowLeftIcon /> Kembali
                    </button>
                    <h2 className="text-3xl font-medium text-gray-800 mb-6">Portal Penulis</h2>
                    <form onSubmit={handleLogin} className="w-full max-w-sm flex flex-col gap-4">
                        <input 
                            type="password" placeholder="Masukkan sandi..." 
                            className="text-center text-xl bg-transparent border-b border-gray-800 pb-2 mb-4 text-gray-800 placeholder-gray-400 focus:outline-none"
                            value={password} onChange={(e) => setPassword(e.target.value)}
                        />
                        {loginError && <p className="text-red-800/80 text-sm text-center -mt-2 mb-2">{loginError}</p>}
                        <button type="submit" className="bg-gray-800 text-[#FDF6E3] py-3 px-6 rounded hover:bg-gray-700 transition">
                            Masuk
                        </button>
                    </form>
                </div>
            );

            const renderReaderIntro = () => (
                <div className="flex flex-col h-full pb-10">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-gray-400/30">
                        <button onClick={() => navigateTo('home', 'backward')} className="flex gap-2 items-center text-gray-500 hover:text-gray-800">
                            <ArrowLeftIcon /> Halaman Utama
                        </button>
                        <span className="text-gray-400 font-medium tracking-widest text-sm">PENDAHULUAN</span>
                    </div>
                    
                    <h2 className="text-3xl font-semibold text-gray-800 mb-8">Prakata</h2>
                    <div className="text-gray-700 whitespace-pre-wrap flex-grow mb-16">
                        {introContent}
                    </div>
                    
                    <div className="flex justify-end mt-auto">
                        <button onClick={() => navigateTo('toc', 'forward')} className="flex items-center gap-2 bg-gray-800 text-[#FDF6E3] py-2 px-6 rounded hover:bg-gray-700 transition shadow-md">
                            Buka Daftar Isi <ArrowRightIcon />
                        </button>
                    </div>
                </div>
            );

            const renderWriterIntro = () => (
                <div className="flex flex-col h-full">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-gray-400/30">
                        <button onClick={saveIntroAndExit} className="flex gap-2 items-center text-gray-500 hover:text-gray-800">
                            <ArrowLeftIcon /> Simpan & Kembali
                        </button>
                        <span className="text-gray-400 italic">Edit Pendahuluan</span>
                    </div>
                    
                    <h2 className="text-3xl font-semibold text-gray-800 mb-8">Prakata</h2>
                    <textarea 
                        value={draftIntro} 
                        onChange={(e) => setDraftIntro(e.target.value)}
                        className="flex-grow text-gray-700 focus:outline-none bg-transparent" 
                        rows="15"
                    />
                </div>
            );

            const renderToc = (isWriter = false) => (
                <div className="flex flex-col h-full pb-10">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-gray-400/30">
                        <button onClick={() => navigateTo(isWriter ? 'home' : 'reader-intro', 'backward')} className="flex gap-2 items-center text-gray-500 hover:text-gray-800">
                            <ArrowLeftIcon /> {isWriter ? 'Keluar' : 'Pendahuluan'}
                        </button>
                        <span className="text-gray-400 font-medium tracking-widest text-sm">{isWriter ? 'PORTAL PENULIS' : 'DAFTAR ISI'}</span>
                    </div>
                    
                    <div className="flex justify-between items-end mb-8">
                        <h2 className="text-3xl font-semibold text-gray-800">{isWriter ? 'Karya Saya' : 'Daftar Isi'}</h2>
                        {isWriter && (
                            <div className="flex gap-2">
                                <button onClick={() => { setDraftIntro(introContent); navigateTo('writer-intro', 'forward'); }} className="flex items-center gap-1 text-sm border border-gray-800 text-gray-800 px-3 py-1.5 rounded hover:bg-gray-800/10">
                                    <EditIcon /> Pendahuluan
                                </button>
                                <button onClick={addNewPoem} className="flex items-center gap-1 text-sm bg-gray-800 text-[#FDF6E3] px-3 py-1.5 rounded hover:bg-gray-700">
                                    <PlusIcon /> Tulis Baru
                                </button>
                            </div>
                        )}
                    </div>
                    
                    <div className="flex flex-col flex-grow">
                        {poems.length === 0 && <p className="text-gray-500 italic">Belum ada karya yang ditulis.</p>}
                        {poems.map(poem => (
                            <div key={poem.id} className="relative group border-b border-gray-400/30 py-4 hover:bg-black/5 px-2 -mx-2 transition-colors rounded">
                                <button 
                                    onClick={() => { 
                                        setActivePoemId(poem.id); 
                                        if(isWriter){
                                            setDraftTitle(poem.title);
                                            setDraftContent(poem.content);
                                            navigateTo('writer', 'forward');
                                        } else {
                                            navigateTo('reader', 'forward');
                                        }
                                    }} 
                                    className="text-left w-full pr-10"
                                >
                                    <h3 className="text-xl font-medium text-gray-800">{poem.title ? poem.title : 'Tanpa Judul'}</h3>
                                    <div className="flex justify-between text-sm text-gray-500 mt-2">
                                        <span>{isWriter ? 'Klik untuk mengedit' : `Oleh: ${poem.author}`}</span>
                                        <span>{poem.date}</span>
                                    </div>
                                </button>
                                {isWriter && (
                                    <button 
                                        onClick={(e) => handleDeletePoem(e, poem.id)}
                                        className="absolute top-4 right-4 text-gray-400 hover:text-red-700 opacity-0 group-hover:opacity-100 transition-opacity p-2"
                                        title="Hapus Karya"
                                    >
                                        <TrashIcon />
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderWriter = () => (
                <div className="flex flex-col h-full">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-gray-400/30">
                        <button onClick={savePoemAndExit} className="flex gap-2 items-center text-gray-500 hover:text-gray-800">
                            <ArrowLeftIcon /> Simpan & Kembali
                        </button>
                        <span className="text-gray-400 italic">Mode Mengedit</span>
                    </div>
                    
                    <input 
                        type="text" value={draftTitle} onChange={(e) => setDraftTitle(e.target.value)}
                        className="text-3xl font-semibold text-gray-800 mb-8 focus:outline-none bg-transparent"
                    />
                    <textarea 
                        value={draftContent} onChange={(e) => setDraftContent(e.target.value)}
                        className="flex-grow text-gray-700 focus:outline-none bg-transparent" rows="15"
                    />
                </div>
            );

            const renderReader = () => (
                <div className="flex flex-col h-full pb-10">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-gray-400/30">
                        <button onClick={() => navigateTo('toc', 'backward')} className="flex gap-2 items-center text-gray-500 hover:text-gray-800">
                            <ArrowLeftIcon /> Daftar Isi
                        </button>
                        <span className="text-gray-400 font-medium tracking-widest text-sm">ENAM PURNAMA</span>
                    </div>
                    
                    <h2 className="text-3xl font-semibold text-gray-800 mb-2">{activePoem.title}</h2>
                    <p className="text-sm text-gray-500 italic mb-8 border-b-2 border-gray-400/10 pb-4 inline-block">
                        Ditulis oleh {activePoem.author} pada {activePoem.date}
                    </p>
                    
                    <div className="text-gray-700 whitespace-pre-wrap flex-grow mb-16">
                        {activePoem.content}
                    </div>

                    <div className="mt-12 pt-8 border-t-2 border-gray-400/20">
                        <h3 className="text-xl font-medium text-gray-800 mb-6 italic">Kesan Pembaca</h3>
                        <div className="flex flex-col gap-4 mb-8">
                            {!activePoem || !activePoem.notes || activePoem.notes.length === 0 ? (
                                <p className="text-gray-500 italic text-sm">Belum ada kesan dari pembaca. Jadilah yang pertama.</p>
                            ) : (
                                activePoem.notes.map((note, idx) => (
                                    <div key={idx} className="bg-black/5 p-4 rounded-r-lg border-l-4 border-gray-700/50 relative flex flex-col">
                                        {editingNoteIdx === idx ? (
                                            <div className="flex flex-col gap-2 mt-1 w-full">
                                                <textarea 
                                                    value={editNoteText}
                                                    onChange={(e) => setEditNoteText(e.target.value)}
                                                    className="w-full bg-transparent border-b border-gray-400 focus:outline-none text-gray-700 italic text-sm resize-none"
                                                    rows="2"
                                                />
                                                <div className="flex justify-end gap-3 mt-1">
                                                    <button onClick={() => setEditingNoteIdx(null)} className="text-xs text-gray-500 hover:text-gray-800 font-medium">Batal</button>
                                                    <button onClick={() => handleSaveEditNote(idx)} className="text-xs bg-gray-800 text-[#FDF6E3] px-3 py-1 rounded hover:bg-gray-700">Simpan</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col w-full">
                                                <p className="text-gray-700 italic pb-2 border-b border-gray-400/10 mb-2">"{note}"</p>
                                                <button 
                                                    onClick={() => { setEditingNoteIdx(idx); setEditNoteText(note); }}
                                                    className="self-end text-xs text-gray-500 hover:text-gray-800 flex items-center gap-1 transition-colors"
                                                >
                                                    <EditIcon /> Edit pesan
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                        <form onSubmit={handleAddNote} className="flex gap-2 items-end">
                            <textarea 
                                rows="1" placeholder="Tinggalkan pesan untuk penulis..."
                                value={newNote} onChange={(e) => setNewNote(e.target.value)}
                                className="flex-grow bg-black/5 p-3 rounded-lg border-none focus:outline-none focus:ring-1 focus:ring-gray-400 text-sm h-12 pt-3"
                                style={{ lineHeight: '1.5' }}
                            />
                            <button type="submit" disabled={!newNote.trim() || activePoem.id === 0} className="bg-gray-800 text-[#FDF6E3] p-3 rounded-lg hover:bg-gray-700 disabled:opacity-50 h-12 flex items-center justify-center">
                                <SendIcon />
                            </button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="perspective-wrapper">
                    <div className={`notebook-page ${animClass}`}>
                        <div className="lined-paper">
                            <div className={`${contentState} h-full`}>
                                {currentView === 'home' && renderHome()}
                                {currentView === 'login' && renderLogin()}
                                {currentView === 'reader-intro' && renderReaderIntro()}
                                {currentView === 'writer-intro' && renderWriterIntro()}
                                {currentView === 'toc' && renderToc(false)}
                                {currentView === 'writer-toc' && renderToc(true)}
                                {currentView === 'writer' && renderWriter()}
                                {currentView === 'reader' && renderReader()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
