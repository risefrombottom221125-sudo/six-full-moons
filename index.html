<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enam Purnama</title>
    <!-- Tailwind CSS untuk tata letak -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk menerjemahkan JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Lora untuk estetika puisi klasik -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #2c2925;
            font-family: 'Lora', serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .perspective-wrapper {
            perspective: 2500px;
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        .notebook-page {
            background-color: #FDF6E3;
            min-height: 80vh;
            border-radius: 4px 16px 16px 4px;
            box-shadow:
                inset 12px 0 20px -5px rgba(0,0,0,0.1),
                15px 20px 30px rgba(0,0,0,0.3);
            border-left: 5px solid #d4c5a9;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: left center;
        }

        .lined-paper {
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #eadaaf 31px,
                #eadaaf 32px
            );
            line-height: 32px;
            padding: 32px 40px;
            min-height: 100%;
        }

        .flip-forward {
            animation: flipForwardAnim 1.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        } 
        .flip-backward {
            animation: flipBackwardAnim 1.8s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
        }

        @keyframes flipForwardAnim {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
            40% { transform: rotateY(-30deg) skewY(-3deg) scale(1.02); filter: brightness(0.9); box-shadow: 25px 30px 40px rgba(0,0,0,0.2); }
            100% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
        }

        @keyframes flipBackwardAnim {
            0% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
            40% { transform: rotateY(30deg) skewY(3deg) scale(1.02); filter: brightness(0.9); box-shadow: -15px 30px 40px rgba(0,0,0,0.2); }
            100% { transform: rotateY(0deg) skewY(0deg) scale(1); filter: brightness(1); }
        }

        .fade-out { opacity: 0; transition: opacity 0.4s ease; }
        .fade-in { opacity: 1; transition: opacity 0.8s ease; }

        textarea, input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            resize: none;
            font-family: inherit;
        }

        textarea {
            line-height: 32px;
            margin-top: 1px;
        }
    </style>
</head>
<body>
